<!doctype html>
<html><head><meta charset="utf-8"></head><body><pre id="result">PENDING</pre>
<script>
(() => {
  const out = {probe:'browser_semantics_submit_composed', ua:navigator.userAgent, cases:[]};
  const add=(id,observed,detail)=>out.cases.push({id,observed,detail:detail===undefined?null:detail});
  const selfNoHash=location.href.split('#')[0];
  // Submit aus geschlossenem Shadow-Root: window-Capture (Shield-Mechanik) beobachten.
  let windowCaptureFired=0;
  const l=e=>{windowCaptureFired++; e.preventDefault();};
  window.addEventListener('submit', l, true);
  const host=document.createElement('div'); document.body.appendChild(host);
  const sh=host.attachShadow({mode:'closed'});
  const f=document.createElement('form'); f.action=selfNoHash+'#shadow-submit'; sh.appendChild(f);
  let threw=null;
  try{ f.requestSubmit(); }catch(e){ threw=String(e&&e.message||e); }
  window.removeEventListener('submit', l, true);
  add('shadow_root_requestSubmit_window_capture_fired', windowCaptureFired, 'threw='+threw);
  out.ok=true;
  document.getElementById('result').textContent='RESULT_JSON:'+JSON.stringify(out);
})();
</script></body></html>
