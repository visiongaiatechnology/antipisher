name: Bug report
description: Etwas funktioniert nicht wie erwartet (Alpha 0.1.1)
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für den Alpha-Test. Bitte **keine echten Zugangsdaten, Passwörter oder aktiven Phishing-URLs** posten.
        Für Verdachtsfälle bitte reservierte Domains wie `example.test` verwenden.
  - type: input
    id: version
    attributes:
      label: Antipisher-Version
      description: Steht im Popup (z. B. 0.1.1)
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome (MV3)
        - Firefox (MV3)
        - Anderer Chromium-Browser
    validations:
      required: true
  - type: input
    id: browser_version
    attributes:
      label: Browser-Version
      placeholder: "z. B. Chrome 155 / Firefox 140"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Betriebssystem
      placeholder: "z. B. Windows 11, macOS 15, Ubuntu 24.04"
  - type: textarea
    id: what_happened
    attributes:
      label: Was ist passiert?
      description: Kurz und konkret.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Reproduzieren
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Konsolen-/Fehlermeldungen (optional)
      description: Browser-Konsole, nur ohne sensible Daten.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe keine echten Zugangsdaten, Passwörter oder aktiven Phishing-URLs eingefügt.
          required: true
