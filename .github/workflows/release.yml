name: release

on:
  push:
    tags:
      - "v*"
      - "chrome-v*"
      - "firefox-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: node --test tests/*.test.cjs

      - name: Build release ZIPs
        run: python build.py

      - name: Verify deterministic build
        run: |
          sha256sum ../Antipisher-*.zip > /tmp/build1.txt
          python build.py
          sha256sum ../Antipisher-*.zip > /tmp/build2.txt
          diff /tmp/build1.txt /tmp/build2.txt
          cd ..
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ../Antipisher-Chrome-v*.zip \
            ../Antipisher-Firefox-v*.zip \
            ../Antipisher-Source-v*.zip \
            ../SHA256SUMS.txt \
            --title "Antipisher $GITHUB_REF_NAME (Alpha)" \
            --generate-notes \
            --prerelease
